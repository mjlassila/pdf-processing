[paths]
uploadPath = /usr/local/pdfa_conversion/
processedPath = /usr/local/pdfa_conversion/
xmpPath = /usr/local/pdfa_conversion/

[configs]
hash = sha256
pdfProcessor = /opt/pdfapilot/pdfaPilot
pdfOutputArg = "--outputfile="
pdfOverwriteArg = --overwrite
cachefolderArg = "--cachefolder=/usr/local/pdfa_conversion/tmp"
pdfLevelArg = "--level="
metadataArg = "--addxmp="
pdfLangArg = "--language="
pdfForceConversion = --forceconversion_pagestoimages
pdfTimeoutArg = "--timeout="
max_filesize_in_mb = 200
target_pdfa_level = "3b"
timeout = 240

metadataField[] = creator
metadataField[] = title
metadataField[] = keywords
metadataField[] = description
descriptionMaxLenght = 2000

lineRegex = "/^(Fix|Errors|Summary)/"
summaryRegex = "/^Summary\s+Errors\s+(\d+)/"

baseUrl = "/"
